<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>100 Programadores Dijeron — Dinero Rápido</title>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Orbitron:wght@700;900&family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root{
      --Y:#F5C200;--YL:#FFE566;--YD:#D4920A;
      --BR:#1535CC;--BM:#2244DD;--BD:#0A1E88;
      --W:#5C2E00; --WL:#7A3F00;--WD:#3A1800;
    }
    *{box-sizing:border-box;margin:0;padding:0;}
    html,body{width:100%;height:100%;overflow:hidden;}
    body{
      font-family:'Inter',sans-serif;
      background:radial-gradient(ellipse 130% 130% at 50% -5%,
        #FFE566 0%,#F5C200 22%,#D4920A 52%,#B87000 75%,#7A4500 100%);
      display:flex;flex-direction:column;user-select:none;
    }
    .font-tv{font-family:'Anton',Impact,sans-serif;letter-spacing:.06em;}
    .font-led{font-family:'Orbitron',monospace;}

    /* ── ARCH azul ── */
    .arch{
      background:linear-gradient(160deg,var(--BM),var(--BR),var(--BD));
      border:4px solid var(--Y);border-radius:22px;padding:6px;
      box-shadow:0 0 0 2px var(--BD),0 6px 24px rgba(21,53,204,.6),inset 0 2px 6px rgba(255,255,255,.15);
    }
    /* ── BULBS ── */
    .bulbs{display:flex;justify-content:space-around;padding:2px 5px;}
    .bulb{width:10px;height:10px;border-radius:50%;flex-shrink:0;background:#fffde7;box-shadow:0 0 4px var(--Y),0 0 10px rgba(245,194,0,.5);animation:bf 1.1s infinite alternate ease-in-out;}
    .bulb:nth-child(2n){animation-delay:.55s;}
    .bulb:nth-child(3n){animation-delay:.28s;}
    @keyframes bf{0%{opacity:.25;transform:scale(.75)}100%{opacity:1;transform:scale(1.3);box-shadow:0 0 7px #fff,0 0 16px var(--Y);}}
    /* ── ORBS ── */
    .orb{width:clamp(26px,3.5vw,44px);height:clamp(26px,3.5vw,44px);border-radius:50%;flex-shrink:0;background:radial-gradient(circle at 35% 30%,#6699ff,var(--BR),var(--BD));border:3px solid var(--Y);box-shadow:0 0 10px rgba(51,102,255,.8);}
    /* ── BROWN FRAME ── */
    .bframe{background:linear-gradient(160deg,var(--W),var(--WL),var(--W));border:4px solid var(--WD);border-radius:13px;padding:8px;box-shadow:0 3px 12px rgba(0,0,0,.75),inset 0 2px 5px rgba(0,0,0,.55);position:relative;}
    .screw{position:absolute;width:10px;height:10px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#8B6532,#3A1800);border:2px solid #2A1000;box-shadow:inset 0 1px 3px rgba(0,0,0,.8);}

    /* ── TIMERS BAR ── */
    .timer-card{
      background:linear-gradient(160deg,var(--BD),var(--BR),var(--BM));
      border:3px solid var(--Y);border-radius:12px;
      box-shadow:0 0 0 2px var(--BD),0 4px 16px rgba(0,0,0,.7);
      padding:6px 12px;text-align:center;
    }
    .timer-led{
      font-family:'Orbitron',monospace;color:var(--YL);
      text-shadow:0 0 10px var(--Y),0 0 22px rgba(245,194,0,.5);
      line-height:1;
    }
    .total-card{
      background:linear-gradient(160deg,var(--WD),var(--W),var(--WL));
      border:3px solid var(--Y);border-radius:12px;
      box-shadow:0 0 0 2px var(--WD),0 4px 16px rgba(0,0,0,.7);
      padding:6px 12px;text-align:center;
    }

    /* ── QUESTION HEADER BAR (azul para las preguntas) ── */
    .qhdr{
      background:linear-gradient(90deg,var(--BD),var(--BR),var(--BD));
      border:3px solid var(--Y);border-radius:9px;
      padding:6px 12px;text-align:center;
      box-shadow:inset 0 2px 7px rgba(0,0,0,.6);
    }
    .qhdr p{font-family:'Anton',sans-serif;font-size:clamp(.7rem,1.6vw,1rem);color:var(--YL);letter-spacing:.04em;}

    /* ── FM SLOT (ranura de respuesta Fast Money) ── */
    .fm-slot{
      background:linear-gradient(180deg,var(--WL),var(--W),var(--WD));
      border:3px solid var(--WD);border-radius:7px;padding:4px;
      box-shadow:0 2px 9px rgba(0,0,0,.7),inset 0 1px 4px rgba(0,0,0,.5);
    }
    .fm-closed{
      background:repeating-linear-gradient(180deg,#1A1208 0,#1A1208 6px,#2C1E0A 6px,#2C1E0A 8px);
      border:2px solid #100C04;border-radius:4px;
      width:100%;height:100%;display:flex;align-items:center;justify-content:center;
      font-family:'Anton',sans-serif;font-size:1rem;
      color:rgba(26,18,8,.4);
    }
    .fm-open{
      background:linear-gradient(180deg,#0F0600,#1A1208);
      border:2px solid var(--Y);border-radius:4px;
      width:100%;height:100%;display:flex;align-items:center;justify-content:space-between;padding:0 7px;
      box-shadow:inset 0 0 12px rgba(245,194,0,.12);
    }
    .fm-txt{font-family:'Anton',sans-serif;font-size:clamp(.65rem,1.5vw,.92rem);color:var(--YL);flex:1;padding-right:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.03em;}
    .fm-pts{background:linear-gradient(180deg,var(--YL),var(--Y));color:var(--BD);font-family:'Anton',sans-serif;font-size:clamp(.75rem,1.6vw,1rem);padding:2px 7px;border-radius:5px;border:2px solid #fff;white-space:nowrap;flex-shrink:0;}

    /* ── PLAYER HEADER (nombre del jugador) ── */
    .player-hdr{
      background:linear-gradient(90deg,var(--BD),var(--BR),var(--BD));
      border:3px solid var(--Y);border-radius:9px;padding:5px 10px;text-align:center;
    }
    .player-hdr .pname{font-family:'Anton',sans-serif;font-size:clamp(.9rem,2vw,1.2rem);color:var(--YL);letter-spacing:.06em;}

    /* ── WINNER BANNER ── */
    @keyframes wi{0%{transform:scale(.7);opacity:0}100%{transform:scale(1);opacity:1}}
    .win-banner{
      background:linear-gradient(135deg,var(--Y),var(--YL),var(--Y));
      border:5px solid var(--BR);border-radius:18px;padding:12px;
      box-shadow:0 0 55px rgba(245,194,0,.9);
      animation:wi .5s cubic-bezier(.22,1,.36,1) forwards;text-align:center;color:var(--BD);
    }

    /* ── FLIP ── */
    .persp{perspective:1100px;}
    .fw{position:relative;width:100%;height:100%;transition:transform .6s cubic-bezier(.34,1.56,.64,1);transform-style:preserve-3d;}
    .fw.flipped{transform:rotateX(180deg);}
    .ff{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;}
    .ff.back{transform:rotateX(180deg);}
  </style>
</head>
<body>

  <!-- ══ MINI HEADER (sin nav) ══ -->
  <div style="background:linear-gradient(90deg,var(--BD),var(--BR),var(--BD));border-bottom:3px solid var(--Y);padding:6px 14px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0;">
    <div style="display:flex;align-items:center;gap:10px;">
      <img src="logo ug mb nuevo.png"       alt="Mariachi Builders" style="height:44px;object-fit:contain;filter:drop-shadow(0 1px 3px rgba(0,0,0,.5));"/>
      <img src="AWS_logo_RGB_WHT.png" alt="AWS"               style="height:36px;object-fit:contain;filter:drop-shadow(0 1px 3px rgba(0,0,0,.5));"/>
    </div>
    <div style="text-align:center;flex:1;">
      <div class="font-tv" style="font-size:clamp(.8rem,2vw,1.2rem);color:var(--YL);letter-spacing:.12em;">DINERO RÁPIDO</div>
      <div style="font-size:.52rem;font-family:monospace;text-transform:uppercase;letter-spacing:.14em;color:rgba(255,230,102,.55);">100 Programadores Dijeron · Gran Final</div>
    </div>
    <div style="display:flex;gap:5px;">
      <button onclick="toggleFullScreen()" style="background:rgba(0,0,0,.4);border:2px solid rgba(245,194,0,.4);color:var(--YL);border-radius:8px;padding:4px 8px;cursor:pointer;font-size:.7rem;">⛶</button>
      <button id="btnMute" onclick="toggleMute()" style="background:rgba(0,0,0,.4);border:2px solid rgba(245,194,0,.4);color:var(--YL);border-radius:8px;padding:4px 8px;cursor:pointer;font-size:.7rem;">🔊</button>
    </div>
  </div>

  <!-- ══ MAIN ══ -->
  <main style="flex:1;display:flex;flex-direction:column;gap:7px;padding:9px 14px;overflow:hidden;">

    <!-- TIMER ROW -->
    <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;flex-shrink:0;align-items:center;">
      <div class="timer-card">
        <div style="font-size:.55rem;font-family:monospace;text-transform:uppercase;letter-spacing:.12em;color:rgba(255,230,102,.6);" id="p1label">JUGADOR 1 (25s)</div>
        <div id="timer1" class="timer-led" style="font-size:clamp(2rem,4.5vw,3rem);">25</div>
      </div>
      <div class="total-card">
        <div style="font-size:.55rem;font-family:monospace;text-transform:uppercase;letter-spacing:.12em;color:rgba(255,230,102,.55);">META: 200 PTS</div>
        <div id="fmTotal" class="timer-led" style="font-size:clamp(2.2rem,5vw,3.5rem);">000</div>
        <div style="font-size:.5rem;font-family:monospace;color:rgba(255,230,102,.45);text-transform:uppercase;letter-spacing:.1em;">TOTAL ACUMULADO</div>
      </div>
      <div class="timer-card">
        <div style="font-size:.55rem;font-family:monospace;text-transform:uppercase;letter-spacing:.12em;color:rgba(255,230,102,.6);" id="p2label">JUGADOR 2 (25s)</div>
        <div id="timer2" class="timer-led" style="font-size:clamp(2rem,4.5vw,3rem);">25</div>
      </div>
    </div>

    <!-- WINNER BANNER (oculto hasta declarar ganador) -->
    <div id="winBanner" class="win-banner" style="display:none;flex-shrink:0;position:relative;overflow:hidden;">
      <div style="font-size:.6rem;font-family:monospace;text-transform:uppercase;font-weight:900;letter-spacing:.15em;">🏆 ¡CAMPEONES DE DINERO RÁPIDO!</div>
      <div id="winTeamName" class="font-tv" style="font-size:clamp(1.8rem,4.5vw,3.5rem);letter-spacing:.1em;margin:4px 0;text-shadow:0 0 20px rgba(10,30,136,.5);"></div>
      <div style="font-size:.65rem;font-family:monospace;font-weight:900;letter-spacing:.1em;">¡SE LLEVAN EL GRAN PREMIO!</div>
    </div>

    <!-- TABLERO DINERO RÁPIDO (mismo diseño que tablero principal) -->
    <div class="arch" style="flex:1;display:flex;flex-direction:column;min-height:0;">

      <!-- Bombillas arriba -->
      <div class="bulbs">
        <span class="bulb"></span><span class="bulb"></span><span class="bulb"></span><span class="bulb"></span>
        <span class="bulb"></span><span class="bulb"></span><span class="bulb"></span><span class="bulb"></span>
        <span class="bulb"></span><span class="bulb"></span><span class="bulb"></span><span class="bulb"></span>
        <span class="bulb"></span><span class="bulb"></span><span class="bulb"></span><span class="bulb"></span>
        <span class="bulb"></span><span class="bulb"></span><span class="bulb"></span><span class="bulb"></span>
        <span class="bulb"></span><span class="bulb"></span><span class="bulb"></span><span class="bulb"></span>
      </div>

      <!-- Título + orbs -->
      <div style="display:flex;align-items:center;gap:7px;padding:3px 5px;flex-shrink:0;">
        <div class="orb"></div>
        <div style="flex:1;text-align:center;">
          <div class="font-tv" style="font-size:clamp(.8rem,2vw,1.3rem);color:var(--YL);letter-spacing:.12em;text-shadow:0 0 10px rgba(255,230,102,.5),2px 2px 4px rgba(0,0,0,.8);">DINERO RÁPIDO</div>
          <div style="font-size:.52rem;letter-spacing:.16em;color:rgba(255,230,102,.55);font-family:monospace;text-transform:uppercase;">Meta: 200 puntos · Gran Final</div>
        </div>
        <div class="orb"></div>
      </div>

      <!-- Marco café -->
      <div class="bframe" style="flex:1;display:flex;flex-direction:column;min-height:0;margin:3px 2px;gap:5px;">
        <span class="screw" style="top:5px;left:5px;"></span>
        <span class="screw" style="top:5px;right:5px;"></span>
        <span class="screw" style="bottom:5px;left:5px;"></span>
        <span class="screw" style="bottom:5px;right:5px;"></span>

        <!-- Dos columnas: J1 y J2 -->
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;flex:1;min-height:0;">

          <!-- COLUMNA JUGADOR 1 -->
          <div style="display:flex;flex-direction:column;gap:5px;">
            <div class="player-hdr">
              <div id="nameP1disp" class="pname">JUGADOR 1</div>
              <div style="font-size:.52rem;font-family:monospace;color:rgba(255,230,102,.5);text-transform:uppercase;letter-spacing:.1em;">25 SEGUNDOS</div>
            </div>
            <div id="fm1rows" style="display:flex;flex-direction:column;gap:5px;flex:1;"></div>
          </div>

          <!-- COLUMNA JUGADOR 2 -->
          <div style="display:flex;flex-direction:column;gap:5px;">
            <div class="player-hdr">
              <div id="nameP2disp" class="pname">JUGADOR 2</div>
              <div style="font-size:.52rem;font-family:monospace;color:rgba(255,230,102,.5);text-transform:uppercase;letter-spacing:.1em;">25 SEGUNDOS</div>
            </div>
            <div id="fm2rows" style="display:flex;flex-direction:column;gap:5px;flex:1;"></div>
          </div>

        </div>
      </div>

      <!-- Bombillas abajo -->
      <div class="bulbs" style="margin-top:3px;">
        <span class="bulb"></span><span class="bulb"></span><span class="bulb"></span><span class="bulb"></span>
        <span class="bulb"></span><span class="bulb"></span><span class="bulb"></span><span class="bulb"></span>
        <span class="bulb"></span><span class="bulb"></span><span class="bulb"></span><span class="bulb"></span>
        <span class="bulb"></span><span class="bulb"></span><span class="bulb"></span><span class="bulb"></span>
        <span class="bulb"></span><span class="bulb"></span><span class="bulb"></span><span class="bulb"></span>
        <span class="bulb"></span><span class="bulb"></span><span class="bulb"></span><span class="bulb"></span>
      </div>
    </div>

  </main>

  <script>
    const CH=new BroadcastChannel('100_prog_dijeron');
    let muted=false,actx=null,prevFmWinner=false;

    function loadSt(){
      try{const r=localStorage.getItem('100_prog_state');if(r)return JSON.parse(r);}catch(e){}
      return{fastMoney:{
        p1Name:'Jugador 1',p2Name:'Jugador 2',
        playingTeam:null,fmWinner:false,
        p1Time:25,p2Time:25,timerRunning:false,activeTimerPlayer:null,
        p1Data:[{answer:'',points:0,revealed:false,revealedPoints:false},{answer:'',points:0,revealed:false,revealedPoints:false},{answer:'',points:0,revealed:false,revealedPoints:false},{answer:'',points:0,revealed:false,revealedPoints:false},{answer:'',points:0,revealed:false,revealedPoints:false}],
        p2Data:[{answer:'',points:0,revealed:false,revealedPoints:false},{answer:'',points:0,revealed:false,revealedPoints:false},{answer:'',points:0,revealed:false,revealedPoints:false},{answer:'',points:0,revealed:false,revealedPoints:false},{answer:'',points:0,revealed:false,revealedPoints:false}]
      }};
    }

    let gs=loadSt();

    CH.onmessage=ev=>{
      if(!ev.data?.payload)return;
      gs=ev.data.payload;
      const fm=gs.fastMoney||{};
      if(ev.data.action==='PLAY_CORRECTO')snd('correcto');
      else if(ev.data.action==='START_FM_TIMER')playClk();
      else if(ev.data.action==='STOP_FM_TIMER')stopClk();
      if(ev.data.action==='FM_WINNER'||(!prevFmWinner&&fm.fmWinner)){
        snd('triunfo'); triggerWinOverlay(fm);
      }
      prevFmWinner=fm.fmWinner||false;
      render();
    };
    window.addEventListener('storage',e=>{if(e.key==='100_prog_state'){gs=loadSt();render();}});

    function render(){
      const fm=gs.fastMoney||{};
      const p1n=fm.p1Name||'Jugador 1';
      const p2n=fm.p2Name||'Jugador 2';

      // Timers
      const t1=document.getElementById('timer1'),t2=document.getElementById('timer2');
      const l1=document.getElementById('p1label'),l2=document.getElementById('p2label');
      if(t1)t1.textContent=String(fm.p1Time??25).padStart(2,'0');
      if(t2)t2.textContent=String(fm.p2Time??25).padStart(2,'0');
      if(l1)l1.textContent=`${p1n} (25s)`.toUpperCase();
      if(l2)l2.textContent=`${p2n} (25s)`.toUpperCase();

      // Timer color: rojo si <= 5s
      [['timer1',fm.p1Time],['timer2',fm.p2Time]].forEach(([id,t])=>{
        const el=document.getElementById(id);
        if(el){const c=t<=5?'#FF4444':'#FFE566';el.style.color=c;el.style.textShadow=`0 0 10px ${c},0 0 22px ${c}80`;}
      });

      // Nombres de jugadores
      const np1=document.getElementById('nameP1disp'),np2=document.getElementById('nameP2disp');
      if(np1)np1.textContent=p1n.toUpperCase();
      if(np2)np2.textContent=p2n.toUpperCase();

      // Total
      let total=0;
      (fm.p1Data||[]).forEach(d=>{if(d.revealedPoints)total+=Number(d.points)||0;});
      (fm.p2Data||[]).forEach(d=>{if(d.revealedPoints)total+=Number(d.points)||0;});
      const fte=document.getElementById('fmTotal');
      if(fte){fte.textContent=String(total).padStart(3,'0');}

      // Winner banner — solo se muestra cuando el conductor lo declara
      const wb=document.getElementById('winBanner');
      const wtn=document.getElementById('winTeamName');
      if(wb){
        wb.style.display=fm.fmWinner?'block':'none';
        if(fm.fmWinner&&wtn){
          const tname=fm.playingTeam==='A'?(gs.teamA?.name||'Equipo A'):(gs.teamB?.name||'Equipo B');
          wtn.textContent=`¡${tname.toUpperCase()} GANA!`;
        }
      }

      // Rows J1
      const r1=document.getElementById('fm1rows');
      if(r1&&fm.p1Data){
        r1.innerHTML='';
        fm.p1Data.forEach((d,i)=>{
          const h=`calc((100% - ${(fm.p1Data.length-1)*5}px) / ${fm.p1Data.length})`;
          const w=document.createElement('div');w.className='persp';w.style.cssText=`height:${h};min-height:clamp(30px,3.5vw,48px);flex:1;`;
          w.innerHTML=`<div class="fw ${d.revealed?'flipped':''}">
            <div class="ff"><div class="fm-slot" style="height:100%;"><div class="fm-closed">${i+1}</div></div></div>
            <div class="ff back"><div class="fm-slot" style="height:100%;"><div class="fm-open"><span class="fm-txt">${d.answer||'—'}</span><span class="fm-pts">${d.revealedPoints ? d.points : '???'}</span></div></div></div>
          </div>`;
          r1.appendChild(w);
        });
      }

      // Rows J2
      const r2=document.getElementById('fm2rows');
      if(r2&&fm.p2Data){
        r2.innerHTML='';
        fm.p2Data.forEach((d,i)=>{
          const w=document.createElement('div');w.className='persp';w.style.cssText=`min-height:clamp(30px,3.5vw,48px);flex:1;`;
          w.innerHTML=`<div class="fw ${d.revealed?'flipped':''}">
            <div class="ff"><div class="fm-slot" style="height:100%;"><div class="fm-closed">${i+1}</div></div></div>
            <div class="ff back"><div class="fm-slot" style="height:100%;"><div class="fm-open"><span class="fm-txt">${d.answer||'—'}</span><span class="fm-pts">${d.revealedPoints ? d.points : '???'}</span></div></div></div>
          </div>`;
          r2.appendChild(w);
        });
      }
    }

    // Audio
    let clkEl=null;
    function playClk(){if(muted)return;stopClk();try{const u=localStorage.getItem('100_prog_clockUrl')||'';if(u){clkEl=new Audio(u);clkEl.volume=.95;clkEl.play().catch(()=>{});}}catch(e){}}
    function stopClk(){if(clkEl){try{clkEl.pause();clkEl.src='';clkEl=null;}catch(e){}}}
    const SNDS={correcto:'https://www.myinstants.com/media/sounds/correcto-100-mexicanos-dijeron.mp3',triunfo:'https://www.myinstants.com/media/sounds/triunfo-100-mexicanos-dijeron.mp3'};
    function snd(n){if(muted)return;try{const a=new Audio(SNDS[n]);a.volume=.9;a.play().catch(()=>{});}catch(e){}}
    function toggleMute(){muted=!muted;document.getElementById('btnMute').textContent=muted?'🔇':'🔊';}
    function toggleFullScreen(){if(!document.fullscreenElement)document.documentElement.requestFullscreen().catch(()=>{});else document.exitFullscreen().catch(()=>{});}

    function triggerWinOverlay(fm){
      const tname=fm?.playingTeam==='A'?(gs.teamA?.name||'Equipo A'):(gs.teamB?.name||'Equipo B');
      const old=document.getElementById('fmWinOverlay');if(old)old.remove();
      const ov=document.createElement('div');
      ov.id='fmWinOverlay';
      ov.style.cssText='position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.85);backdrop-filter:blur(6px);';
      const confetti=Array.from({length:35},(_,i)=>{
        const cols=['#F5C200','#FFE566','#1535CC','#ffffff','#ff4444','#00cc44'];
        const c=cols[i%cols.length],l=Math.random()*100,del=Math.random()*1.8,dur=2+Math.random()*2,sz=5+Math.random()*12;
        return `<div style="position:fixed;top:-20px;left:${l}%;width:${sz}px;height:${sz}px;background:${c};border-radius:${Math.random()>.5?'50%':'3px'};animation:confFall ${dur}s ${del}s ease-in forwards;z-index:9998;pointer-events:none;"></div>`;
      }).join('');
      ov.innerHTML=`
        <style>
          @keyframes fwIn{0%{opacity:0;transform:scale(.7) rotate(-3deg)}100%{opacity:1;transform:scale(1) rotate(0)}}
          @keyframes fwPulse{0%,100%{box-shadow:0 0 50px rgba(245,194,0,.8),0 0 100px rgba(245,194,0,.3)}50%{box-shadow:0 0 90px rgba(245,194,0,1),0 0 160px rgba(245,194,0,.6)}}
          @keyframes confFall{0%{transform:translateY(0) rotate(0deg);opacity:1}100%{transform:translateY(110vh) rotate(720deg);opacity:0}}
        </style>
        ${confetti}
        <div style="background:linear-gradient(135deg,#F5C200,#FFE566,#F5C200);border:6px solid #0A1E88;border-radius:28px;padding:28px 44px;text-align:center;max-width:720px;width:90%;animation:fwIn .5s cubic-bezier(.22,1,.36,1) forwards,fwPulse 1.3s 0.5s infinite;">
          <div style="font-size:.65rem;font-family:monospace;text-transform:uppercase;letter-spacing:.2em;font-weight:900;color:#0A1E88;margin-bottom:8px;">🏆 ¡CAMPEONES DE DINERO RÁPIDO!</div>
          <div style="font-family:'Anton',sans-serif;font-size:clamp(2.2rem,7vw,5rem);letter-spacing:.1em;color:#0A1E88;line-height:1.05;">${tname.toUpperCase()}</div>
          <div style="font-family:'Anton',sans-serif;font-size:clamp(.9rem,2.5vw,1.6rem);letter-spacing:.08em;color:#0A1E88;margin-top:6px;">¡SE LLEVAN EL GRAN PREMIO!</div>
          <button onclick="document.getElementById('fmWinOverlay').remove()" style="margin-top:18px;background:#0A1E88;color:#FFE566;font-family:'Anton',sans-serif;letter-spacing:.05em;font-size:1rem;padding:10px 28px;border-radius:12px;border:3px solid #F5C200;cursor:pointer;transition:.15s;">✕ CERRAR</button>
        </div>`;
      document.body.appendChild(ov);
    }

    window.onload=()=>render();
  </script>
</body>
</html>
